# electron-builder 配置：目录版（需求 §3.7 / §10.5，v2.1 起不再出单文件 exe）
# 打包命令：pnpm dist:win / pnpm dist:mac（electron-vite 三段构建 + 对应平台目录产物）
appId: com.knock.app
productName: Knock
directories:
    output: release
afterPack: ./scripts/afterPack.cjs
# 不让 electron-builder 跑 @electron/rebuild：
#   better-sqlite3 的 Electron ABI 由 postinstall（scripts/electron-deps.mjs）拉预编译解决；
#   uiohook-napi / node-pty 是 NAPI 接口（ABI 无关），其预编译 rebuilder 不认识，
#   会误走源码编译（本机无 VS Build Tools 必失败）。
npmRebuild: false
files:
    - out/main/**
    - out/preload/**
    - out/renderer/**
    - assets/** # 托盘图标
    # es.exe 不进 asar：它经 extraResources 单独放到 resources/（exe 无法从 asar 内 spawn）
    - "!assets/es.exe"
    - package.json
    # 第三方声明(shadcn/ui 组件与 Darwin UI 配色)随产物分发
    - THIRD_PARTY_NOTICES.md
    # ── 原生模块瘦身：删源码/构建残留/明确用不到的预编译 ──
    # 注意：darwin 预编译不在这里排除（mac 包运行时需要），win 包的 darwin 裁剪
    # 由 afterPack.cjs 按平台完成，否则 mac 包原生模块加载失败
    - "!node_modules/better-sqlite3/deps/**"
    - "!node_modules/better-sqlite3/src/**"
    - "!node_modules/better-sqlite3/docs/**"
    - "!node_modules/better-sqlite3/benchmark/**"
    - "!node_modules/better-sqlite3/build/Release/*.lib"
    - "!node_modules/uiohook-napi/libuiohook/**"
    - "!node_modules/uiohook-napi/src/**"
    - "!node_modules/uiohook-napi/prebuilds/linux-**"
    - "!node_modules/uiohook-napi/prebuilds/win32-arm64/**"
    - "!node_modules/node-pty/src/**"
    - "!node_modules/node-pty/scripts/**"
    - "!node_modules/node-pty/typings/**"
    - "!node_modules/node-pty/prebuilds/win32-arm64/**"
    - "!node_modules/node-pty/third_party/**"
    - "!node_modules/node-pty/**/*.pdb"
# 原生模块不能从 asar 内加载；其余 prod 依赖由 electron-builder 自动收入
asarUnpack:
    - node_modules/better-sqlite3/**
    - node_modules/uiohook-napi/**
    - node_modules/node-pty/**
# es.exe（Everything CLI，MIT，见 assets/es-LICENSE.txt）→ resources/es.exe，
# 运行时位置见 src/main/server/everything.ts 的 esExePath()
extraResources:
    - from: assets/es.exe
      to: es.exe
win:
    target:
        - target: dir
          arch: [x64]
    icon: assets/icon.png
# mac 目录版：图标暂缺（icon.png 仅 256px，转 icns 需 ≥512，后续补 1024 图启用 mac.icon）；
# identity: null = 不签名（无开发者证书；对外分发需签名+公证才能过 Gatekeeper）
mac:
    target:
        - target: dir
          arch: [arm64]
    identity: null

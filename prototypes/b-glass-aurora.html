<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MyPage · 原型 B「夜航」</title>
<!--
  原型 B「夜航」Glass Aurora
  定位：深海军蓝夜空上缓慢流动的极光，磨砂玻璃卡片悬浮其上 —— 夜里打开浏览器的那口气。
  记号：bg #0B1120 / text #E7EBF3 / muted #94A3B8 / 极光 蓝#1D4ED8 青#0891B2 紫#6D28D9
  签名元素：会呼吸的极光背景 + 每个站点专属渐变色图标块
  类型标识：图标右下角小圆点（蓝=网页 绿=应用 黄=文件夹 淡紫=文件）
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    background: #0B1120; color: #E7EBF3; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 极光背景：三个大模糊光斑缓慢漂移 */
  .aurora { position: fixed; inset: 0; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(110px); opacity: .45; }
  .b1 { width: 560px; height: 560px; background: #1D4ED8; top: -180px; left: -120px; }
  .b2 { width: 480px; height: 480px; background: #0891B2; top: -120px; right: -140px; }
  .b3 { width: 640px; height: 640px; background: #6D28D9; bottom: -300px; left: 32%; opacity: .38; }
  @media (prefers-reduced-motion: no-preference) {
    .b1 { animation: d1 26s ease-in-out infinite alternate; }
    .b2 { animation: d2 31s ease-in-out infinite alternate; }
    .b3 { animation: d3 36s ease-in-out infinite alternate; }
    @keyframes d1 { to { transform: translate(90px, 70px) scale(1.18); } }
    @keyframes d2 { to { transform: translate(-70px, 90px) scale(1.10); } }
    @keyframes d3 { to { transform: translate(60px, -70px) scale(1.22); } }
  }

  .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 32px 32px 110px; }

  .glass {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 20px;
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
  }

  /* 顶栏 */
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .wordmark {
    font-size: 17px; font-weight: 800;
    background: linear-gradient(90deg, #7DA2FF, #67E8F9 60%, #C4B5FD);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .controls { display: flex; gap: 8px; }
  .gchip {
    height: 34px; padding: 0 14px; display: inline-flex; align-items: center;
    border-radius: 999px; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14); color: #CBD5E1;
    font-family: inherit; font-size: 12.5px; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .gchip:hover { background: rgba(255,255,255,.10); color: #fff; }

  /* 问候 + 搜索 */
  .hero { text-align: center; padding: 46px 0 40px; }
  .greet { font-size: 20px; font-weight: 600; color: #DDE4F0; margin-bottom: 22px; }
  .greet span { color: #7C8AA5; font-weight: 400; }
  .search {
    display: flex; align-items: center; gap: 12px; max-width: 640px; margin: 0 auto;
    height: 58px; padding: 0 18px; border-radius: 999px;
    box-shadow: 0 8px 32px rgba(3,10,30,.5);
  }
  .search svg { flex: none; color: #7C8AA5; }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #E7EBF3; font-family: inherit; font-size: 16px; }
  .search input::placeholder { color: #7C8AA5; }
  .search kbd {
    border: 1px solid rgba(255,255,255,.16); border-radius: 6px; padding: 4px 8px;
    background: rgba(255,255,255,.06); color: #94A3B8; font-family: inherit; font-size: 11px;
  }

  /* 分组卡片 */
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
  .group { padding: 18px 18px 12px; }
  .group header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .group h2 { font-size: 14.5px; font-weight: 700; color: #E7EBF3; }
  .count { font-size: 11.5px; color: #8FA0BB; background: rgba(255,255,255,.07); border-radius: 999px; padding: 2px 9px; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .item {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 9px;
    padding: 10px 4px; border-radius: 14px; text-decoration: none; color: inherit;
    background: none; border: 1px solid transparent; font-family: inherit; cursor: pointer;
    transition: transform .16s, background .16s, border-color .16s;
  }
  .item:hover { transform: translateY(-2px); background: rgba(255,255,255,.055); border-color: rgba(255,255,255,.13); }
  .gico {
    width: 44px; height: 44px; border-radius: 13px;
    background: linear-gradient(135deg, var(--g1), var(--g2));
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 16px;
    box-shadow: 0 4px 14px rgba(2,8,26,.45), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .label { font-size: 12.5px; color: #C3CDDE; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kind {
    position: absolute; top: 7px; right: calc(50% - 27px);
    width: 8px; height: 8px; border-radius: 50%; border: 2px solid rgba(11,17,32,.9);
  }
  .kind.web { background: #60A5FA; }
  .kind.app { background: #34D399; }
  .kind.dir { background: #FBBF24; }
  .kind.doc { background: #C4B5FD; }

  .add-tile { display: none; }
  body.editing .add-tile { display: flex; }
  .add-tile .gico {
    background: rgba(255,255,255,.05); box-shadow: none; color: #8FA0BB;
    border: 1px dashed rgba(255,255,255,.25);
  }
  .add-tile .label { color: #8FA0BB; }

  .switcher {
    position: fixed; right: 14px; bottom: 14px; z-index: 90;
    display: flex; align-items: center; gap: 4px;
    background: rgba(10,15,28,.9); color: #E7EBF3; border-radius: 999px; padding: 6px 8px 6px 14px;
    font-size: 12px; border: 1px solid rgba(255,255,255,.12);
  }
  .switcher a { color: #E7EBF3; opacity: .55; text-decoration: none; padding: 3px 8px; border-radius: 999px; }
  .switcher a:hover { opacity: 1; }
  .switcher a.cur { background: #fff; color: #0B1120; opacity: 1; }

  :focus-visible { outline: 2px solid #67E8F9; outline-offset: 2px; border-radius: 6px; }
  @media (max-width: 640px) { .wrap { padding: 20px 16px 110px; } .hero { padding: 30px 0 28px; } }
</style>
</head>
<body>

<div class="aurora"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<div class="wrap">
  <header class="topbar">
    <div class="wordmark">MyPage</div>
    <div class="controls">
      <button class="gchip" id="editBtn" aria-pressed="false">编辑</button>
      <button class="gchip">主题</button>
      <button class="gchip">EN</button>
    </div>
  </header>

  <div class="hero">
    <p class="greet" id="greet">晚上好<span>，要从哪里出发？</span></p>
    <div class="search glass">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="搜索收藏、应用与文件…" aria-label="搜索"/>
      <kbd>/</kbd>
    </div>
  </div>

  <main class="groups">
    <section class="group glass">
      <header><h2>开发</h2><span class="count">4</span></header>
      <div class="items">
        <a class="item" href="#" data-name="github github.com 代码仓库" title="https://github.com"><span class="gico" style="--g1:#4B5563;--g2:#1F2937">G</span><span class="kind web"></span><span class="label">GitHub</span></a>
        <a class="item" href="#" data-name="stackoverflow stack overflow 问答" title="https://stackoverflow.com"><span class="gico" style="--g1:#F9A03F;--g2:#EE7A1F">S</span><span class="kind web"></span><span class="label">Stack Overflow</span></a>
        <a class="item" href="#" data-name="mdn mozilla 文档" title="https://developer.mozilla.org"><span class="gico" style="--g1:#58C4FF;--g2:#1B7FBD">M</span><span class="kind web"></span><span class="label">MDN</span></a>
        <a class="item" href="#" data-name="vercel 部署" title="https://vercel.com"><span class="gico" style="--g1:#A1A1AA;--g2:#52525B">V</span><span class="kind web"></span><span class="label">Vercel</span></a>
        <button class="item add-tile" data-name=""><span class="gico">+</span><span class="label">添加</span></button>
      </div>
    </section>

    <section class="group glass">
      <header><h2>设计</h2><span class="count">4</span></header>
      <div class="items">
        <a class="item" href="#" data-name="figma 设计" title="https://figma.com"><span class="gico" style="--g1:#A259FF;--g2:#7C3AED">F</span><span class="kind web"></span><span class="label">Figma</span></a>
        <a class="item" href="#" data-name="dribbble 灵感" title="https://dribbble.com"><span class="gico" style="--g1:#F472B6;--g2:#DB2777">D</span><span class="kind web"></span><span class="label">Dribbble</span></a>
        <a class="item" href="#" data-name="jsdesign 即时设计" title="https://js.design"><span class="gico" style="--g1:#60A5FA;--g2:#2563EB">J</span><span class="kind web"></span><span class="label">即时设计</span></a>
        <a class="item" href="#" data-name="behance 作品" title="https://behance.net"><span class="gico" style="--g1:#93B4F0;--g2:#1769FF">B</span><span class="kind web"></span><span class="label">Behance</span></a>
        <button class="item add-tile" data-name=""><span class="gico">+</span><span class="label">添加</span></button>
      </div>
    </section>

    <section class="group glass">
      <header><h2>工作台</h2><span class="count">4</span></header>
      <div class="items">
        <button class="item" data-name="vscode visual studio code 编辑器" title="D:\Apps\VSCode\Code.exe"><span class="gico" style="--g1:#4FC3F7;--g2:#007ACC">V</span><span class="kind app"></span><span class="label">VS Code</span></button>
        <button class="item" data-name="terminal windows terminal 终端" title="wt.exe"><span class="gico" style="--g1:#94A3B8;--g2:#475569">T</span><span class="kind app"></span><span class="label">Terminal</span></button>
        <button class="item" data-name="docker 容器" title="Docker Desktop"><span class="gico" style="--g1:#7DD3FC;--g2:#0284C7">D</span><span class="kind app"></span><span class="label">Docker</span></button>
        <button class="item" data-name="postman api 调试" title="Postman.exe"><span class="gico" style="--g1:#FFB056;--g2:#FF6C37">P</span><span class="kind app"></span><span class="label">Postman</span></button>
        <button class="item add-tile" data-name=""><span class="gico">+</span><span class="label">添加</span></button>
      </div>
    </section>

    <section class="group glass">
      <header><h2>本机文件</h2><span class="count">4</span></header>
      <div class="items">
        <button class="item" data-name="projects 项目 d:\projects" title="D:\Projects"><span class="gico" style="--g1:#FCD34D;--g2:#F59E0B">P</span><span class="kind dir"></span><span class="label">项目</span></button>
        <button class="item" data-name="screenshots 截图" title="D:\Screenshots"><span class="gico" style="--g1:#86EFAC;--g2:#22C55E">S</span><span class="kind dir"></span><span class="label">截图</span></button>
        <button class="item" data-name="resume 简历 pdf" title="D:\Docs\简历2026.pdf"><span class="gico" style="--g1:#F87171;--g2:#DC2626">R</span><span class="kind doc"></span><span class="label">简历2026.pdf</span></button>
        <button class="item" data-name="notes 学习笔记" title="D:\Docs\笔记"><span class="gico" style="--g1:#C4B5FD;--g2:#8B5CF6">N</span><span class="kind dir"></span><span class="label">学习笔记</span></button>
        <button class="item add-tile" data-name=""><span class="gico">+</span><span class="label">添加</span></button>
      </div>
    </section>

    <section class="group glass">
      <header><h2>娱乐</h2><span class="count">4</span></header>
      <div class="items">
        <a class="item" href="#" data-name="bilibili b站 视频" title="https://bilibili.com"><span class="gico" style="--g1:#FDA4AF;--g2:#FB7299">B</span><span class="kind web"></span><span class="label">Bilibili</span></a>
        <a class="item" href="#" data-name="youtube 视频" title="https://youtube.com"><span class="gico" style="--g1:#F87171;--g2:#DC2626">Y</span><span class="kind web"></span><span class="label">YouTube</span></a>
        <button class="item" data-name="steam 游戏" title="steam.exe"><span class="gico" style="--g1:#A5D8FF;--g2:#3D87B8">S</span><span class="kind app"></span><span class="label">Steam</span></button>
        <button class="item" data-name="netease 网易云音乐 音乐" title="cloudmusic.exe"><span class="gico" style="--g1:#F87171;--g2:#C20C0C">W</span><span class="kind app"></span><span class="label">网易云音乐</span></button>
        <button class="item add-tile" data-name=""><span class="gico">+</span><span class="label">添加</span></button>
      </div>
    </section>
  </main>
</div>

<nav class="switcher">
  <span>原型 B · 夜航</span>
  <a href="a-quiet-light.html">A</a>
  <a class="cur" href="b-glass-aurora.html">B</a>
  <a href="c-amber-terminal.html">C</a>
  <a href="d-keycap.html">D</a>
  <a href="index.html">索引</a>
</nav>

<script>
  // —— 原型交互：搜索过滤 / 编辑模式 / 按时段问候（正式版由 React 实现）——
  const searchInput = document.getElementById('search');
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    document.querySelectorAll('.item').forEach((el) => {
      el.style.display = !q || el.dataset.name.toLowerCase().includes(q) ? '' : 'none';
    });
    document.querySelectorAll('.group').forEach((g) => {
      const any = [...g.querySelectorAll('.item')].some((i) => i.style.display !== 'none');
      g.style.display = any ? '' : 'none';
    });
  });

  const editBtn = document.getElementById('editBtn');
  editBtn.addEventListener('click', () => {
    document.body.classList.toggle('editing');
    editBtn.setAttribute('aria-pressed', document.body.classList.contains('editing'));
  });

  const h = new Date().getHours();
  const greet = h < 6 ? '夜深了' : h < 12 ? '早上好' : h < 18 ? '下午好' : '晚上好';
  document.getElementById('greet').innerHTML = greet + '<span>，要从哪里出发？</span>';
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MyPage · 原型 D「键帽」</title>
<!--
  原型 D「键帽」Keycap Brutal
  定位：新粗野主义。启动条目 = 按下按键——每个条目都是一颗有厚度、会物理下陷的键帽。
  记号：paper #F4F0E6（点阵纹理）/ ink #17150F / accents 黄#FFD02F 珊瑚#FF6B57 蓝#4D9DE0 绿#6BCB77 紫#9B72E0
  签名元素：键帽条目（hover 抬起、:active 压下）+ 硬阴影卡片
  类型标识：键帽右上角小图标（地球=网页 窗口=应用 文件夹=dir 文件=doc）
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: light; }
  body {
    background: #F4F0E6;
    background-image: radial-gradient(#DAD3C2 1.2px, transparent 1.2px);
    background-size: 24px 24px;
    color: #17150F;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 36px 32px 110px; }

  /* 顶栏 */
  .topbar { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 54px; height: 54px; background: var(--yellow, #FFD02F);
    border: 2.5px solid #17150F; border-radius: 14px; box-shadow: 4px 4px 0 #17150F;
    display: grid; place-items: center; font-weight: 900; font-size: 19px;
  }
  .titlebox { margin-right: auto; }
  h1 { font-size: 27px; font-weight: 900; letter-spacing: -.02em; }
  .titlebox p { font-size: 12.5px; font-weight: 600; color: #8A8371; margin-top: 2px; }
  .controls { display: flex; gap: 10px; }
  .btn {
    height: 40px; padding: 0 16px; background: #fff;
    border: 2.5px solid #17150F; border-radius: 11px; box-shadow: 3px 3px 0 #17150F;
    font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer;
    transition: transform 70ms, box-shadow 70ms;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #17150F; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #17150F; }
  .btn.pressed { background: #FFD02F; transform: translate(2px, 2px); box-shadow: 0 0 0 #17150F; }

  /* 搜索 */
  .search {
    display: flex; align-items: center; gap: 12px; height: 60px;
    background: #fff; border: 2.5px solid #17150F; border-radius: 15px;
    box-shadow: 5px 5px 0 #17150F; padding: 0 16px; margin: 26px 0 30px;
  }
  .search svg { flex: none; color: #17150F; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; font-family: inherit; font-size: 16px; font-weight: 600; }
  .search input::placeholder { color: #A29A85; font-weight: 500; }
  .search kbd {
    border: 2px solid #17150F; border-radius: 7px; box-shadow: 2px 2px 0 #17150F;
    padding: 3px 8px; font-family: inherit; font-size: 12px; font-weight: 700; background: #F4F0E6;
  }

  /* 分组卡片 */
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 22px; }
  .group {
    background: #fff; border: 2.5px solid #17150F; border-radius: 18px;
    box-shadow: 6px 6px 0 #17150F; padding: 18px;
  }
  .group header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .group h2 { display: flex; align-items: center; gap: 9px; font-size: 15.5px; font-weight: 800; }
  .mark { width: 14px; height: 14px; border-radius: 4px; background: var(--ga); border: 2px solid #17150F; }
  .count {
    font-size: 11.5px; font-weight: 700; background: #F4F0E6;
    border: 2px solid #17150F; border-radius: 7px; padding: 2px 8px;
  }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 14px; }

  /* 键帽条目：底边即厚度，hover 抬起、active 压下 */
  .keycap {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 13px 8px 11px; background: #fff;
    border: 2.5px solid #17150F; border-bottom: 6px solid #17150F; border-radius: 13px;
    font-family: inherit; cursor: pointer;
    transition: transform 70ms, border-bottom-width 70ms;
  }
  .keycap:hover { transform: translateY(-3px); border-bottom-width: 9px; }
  .keycap:active { transform: translateY(3px); border-bottom-width: 2.5px; }
  .kico {
    width: 38px; height: 38px; border-radius: 10px; background: var(--c);
    border: 2px solid #17150F; display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 15px;
  }
  .label { font-size: 13px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kind { position: absolute; top: 7px; right: 7px; width: 13px; height: 13px; color: #A29A85; }
  .kind svg { width: 100%; height: 100%; }

  .add-tile { display: none; background: #F4F0E6; border-style: dashed; }
  body.editing .add-tile { display: flex; }
  .add-tile .kico { background: #fff; color: #A29A85; }
  .add-tile .label { color: #A29A85; }
  .add-tile:hover, .add-tile:active { transform: none; border-bottom-width: 6px; }

  .switcher {
    position: fixed; right: 14px; bottom: 14px; z-index: 90;
    display: flex; align-items: center; gap: 4px;
    background: rgba(23,21,15,.92); color: #F4F0E6; border-radius: 999px; padding: 6px 8px 6px 14px;
    font-size: 12px;
  }
  .switcher a { color: #F4F0E6; opacity: .55; text-decoration: none; padding: 3px 8px; border-radius: 999px; }
  .switcher a:hover { opacity: 1; }
  .switcher a.cur { background: #FFD02F; color: #17150F; opacity: 1; }

  :focus-visible { outline: 3px solid #4D9DE0; outline-offset: 2px; border-radius: 6px; }
  @media (max-width: 640px) { .wrap { padding: 20px 16px 110px; } .titlebox p { display: none; } }
</style>
</head>
<body>

<!-- 类型小图标（地球 / 窗口 / 文件夹 / 文件），内联以保证离线可用 -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-web" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18"/></symbol>
  <symbol id="i-app" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></symbol>
  <symbol id="i-dir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
</svg>

<div class="wrap">
  <header class="topbar">
    <div class="logo">MP</div>
    <div class="titlebox">
      <h1>MyPage</h1>
      <p>个人导航 · 127.0.0.1:8130</p>
    </div>
    <div class="controls">
      <button class="btn" id="editBtn" aria-pressed="false">编辑</button>
      <button class="btn">主题</button>
      <button class="btn">EN</button>
    </div>
  </header>

  <div class="search">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="搜索收藏、应用与文件…" aria-label="搜索"/>
    <kbd>/</kbd>
  </div>

  <main class="groups">
    <section class="group" style="--ga:#FFD02F">
      <header><h2><i class="mark"></i>开发</h2><span class="count">4</span></header>
      <div class="items">
        <button class="keycap" data-name="github github.com 代码仓库" title="https://github.com"><span class="kind"><svg><use href="#i-web"/></svg></span><span class="kico" style="--c:#24292E">G</span><span class="label">GitHub</span></button>
        <button class="keycap" data-name="stackoverflow stack overflow 问答" title="https://stackoverflow.com"><span class="kind"><svg><use href="#i-web"/></svg></span><span class="kico" style="--c:#F48024">S</span><span class="label">Stack Overflow</span></button>
        <button class="keycap" data-name="mdn mozilla 文档" title="https://developer.mozilla.org"><span class="kind"><svg><use href="#i-web"/></svg></span><span class="kico" style="--c:#111827">M</span><span class="label">MDN</span></button>
        <button class="keycap" data-name="vercel 部署" title="https://vercel.com"><span class="kind"><svg><use href="#i-web"/></svg></span><span class="kico" style="--c:#374151">V</span><span class="label">Vercel</span></button>
        <button class="keycap add-tile" data-name=""><span class="kico">+</span><span class="label">添加</span></button>
      </div>
    </section>

    <section class="group" style="--ga:#FF6B57">
      <header><h2><i class="mark"></i>设计</h2><span class="count">4</span></header>
      <div class="items">
        <button class="keycap" data-name="figma 设计" title="https://figma.com"><span class="kind"><svg><use href="#i-web"/></svg></span><span class="kico" style="--c:#A259FF">F</span><span class="label">Figma</span></button>
        <button class="keycap" data-name="dribbble 灵感" title="https://dribbble.com"><span class="kind"><svg><use href="#i-web"/></svg></span><span class="kico" style="--c:#EA4C89">D</span><span class="label">Dribbble</span></button>
        <button class="keycap" data-name="jsdesign 即时设计" title="https://js.design"><span class="kind"><svg><use href="#i-web"/></svg></span><span class="kico" style="--c:#2563EB">J</span><span class="label">即时设计</span></button>
        <button class="keycap" data-name="behance 作品" title="https://behance.net"><span class="kind"><svg><use href="#i-web"/></svg></span><span class="kico" style="--c:#1769FF">B</span><span class="label">Behance</span></button>
        <button class="keycap add-tile" data-name=""><span class="kico">+</span><span class="label">添加</span></button>
      </div>
    </section>

    <section class="group" style="--ga:#4D9DE0">
      <header><h2><i class="mark"></i>工作台</h2><span class="count">4</span></header>
      <div class="items">
        <button class="keycap" data-name="vscode visual studio code 编辑器" title="D:\Apps\VSCode\Code.exe"><span class="kind"><svg><use href="#i-app"/></svg></span><span class="kico" style="--c:#007ACC">V</span><span class="label">VS Code</span></button>
        <button class="keycap" data-name="terminal windows terminal 终端" title="wt.exe"><span class="kind"><svg><use href="#i-app"/></svg></span><span class="kico" style="--c:#4B5563">T</span><span class="label">Terminal</span></button>
        <button class="keycap" data-name="docker 容器" title="Docker Desktop"><span class="kind"><svg><use href="#i-app"/></svg></span><span class="kico" style="--c:#2496ED">D</span><span class="label">Docker</span></button>
        <button class="keycap" data-name="postman api 调试" title="Postman.exe"><span class="kind"><svg><use href="#i-app"/></svg></span><span class="kico" style="--c:#FF6C37">P</span><span class="label">Postman</span></button>
        <button class="keycap add-tile" data-name=""><span class="kico">+</span><span class="label">添加</span></button>
      </div>
    </section>

    <section class="group" style="--ga:#6BCB77">
      <header><h2><i class="mark"></i>本机文件</h2><span class="count">4</span></header>
      <div class="items">
        <button class="keycap" data-name="projects 项目 d:\projects" title="D:\Projects"><span class="kind"><svg><use href="#i-dir"/></svg></span><span class="kico" style="--c:#E9A23B">P</span><span class="label">项目</span></button>
        <button class="keycap" data-name="screenshots 截图" title="D:\Screenshots"><span class="kind"><svg><use href="#i-dir"/></svg></span><span class="kico" style="--c:#58A66B">S</span><span class="label">截图</span></button>
        <button class="keycap" data-name="resume 简历 pdf" title="D:\Docs\简历2026.pdf"><span class="kind"><svg><use href="#i-doc"/></svg></span><span class="kico" style="--c:#D2604A">R</span><span class="label">简历2026.pdf</span></button>
        <button class="keycap" data-name="notes 学习笔记" title="D:\Docs\笔记"><span class="kind"><svg><use href="#i-dir"/></svg></span><span class="kico" style="--c:#8067C4">N</span><span class="label">学习笔记</span></button>
        <button class="keycap add-tile" data-name=""><span class="kico">+</span><span class="label">添加</span></button>
      </div>
    </section>

    <section class="group" style="--ga:#9B72E0">
      <header><h2><i class="mark"></i>娱乐</h2><span class="count">4</span></header>
      <div class="items">
        <button class="keycap" data-name="bilibili b站 视频" title="https://bilibili.com"><span class="kind"><svg><use href="#i-web"/></svg></span><span class="kico" style="--c:#FB7299">B</span><span class="label">Bilibili</span></button>
        <button class="keycap" data-name="youtube 视频" title="https://youtube.com"><span class="kind"><svg><use href="#i-web"/></svg></span><span class="kico" style="--c:#DA291C">Y</span><span class="label">YouTube</span></button>
        <button class="keycap" data-name="steam 游戏" title="steam.exe"><span class="kind"><svg><use href="#i-app"/></svg></span><span class="kico" style="--c:#3D87B8">S</span><span class="label">Steam</span></button>
        <button class="keycap" data-name="netease 网易云音乐 音乐" title="cloudmusic.exe"><span class="kind"><svg><use href="#i-app"/></svg></span><span class="kico" style="--c:#C20C0C">W</span><span class="label">网易云音乐</span></button>
        <button class="keycap add-tile" data-name=""><span class="kico">+</span><span class="label">添加</span></button>
      </div>
    </section>
  </main>
</div>

<nav class="switcher">
  <span>原型 D · 键帽</span>

<script>
  // —— 原型交互：搜索过滤 / 编辑模式（正式版由 React 实现）——
  const searchInput = document.getElementById('search');
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    document.querySelectorAll('.keycap').forEach((el) => {
      el.style.display = !q || el.dataset.name.toLowerCase().includes(q) ? '' : 'none';
    });
    document.querySelectorAll('.group').forEach((g) => {
      const any = [...g.querySelectorAll('.keycap')].some((i) => i.style.display !== 'none');
      g.style.display = any ? '' : 'none';
    });
  });

  const editBtn = document.getElementById('editBtn');
  editBtn.addEventListener('click', () => {
    const on = document.body.classList.toggle('editing');
    editBtn.setAttribute('aria-pressed', on);
    editBtn.classList.toggle('pressed', on);
  });
</script>
</body>
</html>
